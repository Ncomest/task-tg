# VPS override: publish only the web entry point, leaving port 443 untouched.
services:
  postgres:
    ports: !reset []
  api:
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      start_period: 60s
      retries: 5
  web:
    ports: !override
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
