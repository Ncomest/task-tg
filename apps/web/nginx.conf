# Telegram may pass start parameters in the query string. Do not log query args.
log_format task_tg_safe '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log task_tg_safe;
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /index.html {
    add_header Cache-Control "no-store, max-age=0" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
